apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: traffic-app
  template:
    metadata:
      labels:
        app: traffic-app
    spec:
      containers:
      - name: traffic-container
        image: DOCKERHUB_USERNAME/traffic-dashboard:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: traffic-service
spec:
  type: NodePort
  selector:
    app: traffic-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32080
