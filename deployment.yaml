apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-management-system
  labels:
    app: traffic-dashboard
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: traffic-dashboard
  template:
    metadata:
      labels:
        app: traffic-dashboard
    spec:
      containers:
      - name: traffic-dashboard
        image: YOUR_DOCKERHUB_USERNAME/traffic-dashboard:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        # Probes ensure deployment fails quickly if a faulty release breaks the endpoint
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: traffic-management-service
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
  selector:
    app: traffic-dashboard

